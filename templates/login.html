{% extends 'base.html' %}

{% block title %}
Login
{% endblock %}

{% block content %}

<div class="auth-wrapper">

<div class="card auth-card">

<div class="logo">
NexTalk
</div>

<p class="subtitle">
Welcome back. Login to continue chatting.
</p>
{% if error %}
<div class="error-message">
    {{ error }}
</div>
{% endif %}

<form method="POST">

{% csrf_token %}

<input
type="text"
name="username"
placeholder="Username">

<input
type="password"
name="password"
placeholder="Password">

<button type="submit">

Login

</button>

</form>

<div class="bottom-text">

Don't have an account?

<a href="{% url 'signup' %}">

Create Account

</a>

</div>

</div>

</div>

{% endblock %}
